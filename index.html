<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PREDICTOR — Pronostics IA Football</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060910; --card: #0d1624; --green: #05d46b;
      --amber: #f5a623; --red: #ff3d5a; --text: #e2e8f4; --muted: rgba(255,255,255,0.4);
    }
    html, body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
    #root { min-height: 100vh; position: relative; z-index: 1; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    button { font-family: 'Inter', sans-serif; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(5,212,107,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(5,212,107,0.025) 1px, transparent 1px);
      background-size: 48px 48px; pointer-events: none; z-index: 0;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .fade-up { animation: fadeUp 0.4s ease both; }
    .spin { animation: spin 1s linear infinite; display:inline-block; }
    .pulse { animation: pulse 1.5s ease-in-out infinite; }

    /* Config screen */
    .config-overlay {
      position: fixed; inset: 0; background: rgba(6,9,16,0.97);
      backdrop-filter: blur(12px); z-index: 1000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .config-box {
      background: #0d1624; border: 1px solid rgba(5,212,107,0.3);
      border-radius: 20px; padding: 36px 28px; width: 100%; max-width: 460px;
      box-shadow: 0 0 60px rgba(5,212,107,0.1);
    }
    .config-input {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 12px 14px; color: #e2e8f4; font-size: 13px;
      font-family: 'Inter', sans-serif; margin-bottom: 12px; outline: none;
      transition: border-color 0.2s;
    }
    .config-input:focus { border-color: #05d46b; }
    .config-btn {
      width: 100%; background: #05d46b; color: #000; border: none;
      border-radius: 10px; padding: 14px; font-size: 14px; font-weight: 800;
      cursor: pointer; letter-spacing: 0.08em; transition: opacity 0.2s;
    }
    .config-btn:hover { opacity: 0.85; }

    /* Loading */
    .loader { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; gap:16px; }
    .loader-ring { width:48px; height:48px; border:3px solid rgba(5,212,107,0.15); border-top-color:#05d46b; border-radius:50%; animation:spin 0.8s linear infinite; }

    /* Error */
    .error-box { background:#1a0a0e; border:1px solid #ff3d5a44; border-radius:12px; padding:20px; margin:20px; color:#ff3d5a; font-size:13px; line-height:1.6; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── CONSTANTS ─────────────────────────────────────────────────────────────────
const COMPETITIONS = {
  UCL:  { id: 2001, name: "Ligue des Champions", short: "UCL",  color: "#1a6bff" },
  PL:   { id: 2021, name: "Premier League",       short: "PL",   color: "#3d195b" },
  LIGA: { id: 2014, name: "La Liga",               short: "LIGA", color: "#ee8b00" },
  L1:   { id: 2015, name: "Ligue 1",               short: "L1",   color: "#009A44" },
  BUN:  { id: 2002, name: "Bundesliga",             short: "BUN",  color: "#d20515" },
  SA:   { id: 2019, name: "Serie A",                short: "SA",   color: "#024494" },
  PPT:  { id: 2017, name: "Liga Portugal",          short: "LP",   color: "#006600" },
};
const COMP_IDS = Object.values(COMPETITIONS).map(c => c.id);
const REFRESH_INTERVAL = 5 * 60 * 1000; // 5 min

// ── STORAGE ───────────────────────────────────────────────────────────────────
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k,v) => { try { localStorage.setItem(k,v); } catch {} },
};

// ── HELPERS ───────────────────────────────────────────────────────────────────
function confColor(v) { return v >= 65 ? "#05d46b" : v >= 45 ? "#f5a623" : "#ff3d5a"; }
function leagueFromId(id) { return Object.values(COMPETITIONS).find(c => c.id === id) || { name:"Autre", short:"?", color:"#888" }; }

// ── FOOTBALL-DATA API (via CORS proxy) ───────────────────────────────────────
const PROXY = "https://corsproxy.io/?url=";

async function fdFetch(fdKey, path) {
  const url = `https://api.football-data.org/v4${path}`;
  const proxied = `${PROXY}${encodeURIComponent(url)}`;
  const res = await fetch(proxied, {
    headers: { "X-Auth-Token": fdKey, "Origin": "https://rudydemirci-lab.github.io" }
  });
  if (!res.ok) throw new Error(`Football-Data ${res.status}: ${res.statusText}`);
  return res.json();
}

async function fetchMatches(fdKey) {
  const today = new Date().toISOString().slice(0,10);
  const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0,10);
  const data = await fdFetch(fdKey, `/matches?dateFrom=${today}&dateTo=${tomorrow}`);
  return (data.matches || []).filter(m => COMP_IDS.includes(m.competition?.id));
}

async function fetchH2H(fdKey, matchId) {
  try {
    const data = await fdFetch(fdKey, `/matches/${matchId}/head2head?limit=5`);
    return (data.matches || []).slice(0,5);
  } catch { return []; }
}

async function fetchStandings(fdKey, competitionId) {
  try {
    return await fdFetch(fdKey, `/competitions/${competitionId}/standings`);
  } catch { return null; }
}

// ── GEMINI AI ─────────────────────────────────────────────────────────────────
async function analyzeMatchWithGemini(geminiKey, match, h2hMatches, homeStanding, awayStanding) {
  const prompt = `Tu es un expert en pronostics football. Analyse ce match et retourne UNIQUEMENT un objet JSON valide, sans markdown, sans texte avant ou après.

MATCH: ${match.homeTeam.name} vs ${match.awayTeam.name}
COMPÉTITION: ${match.competition.name}
DATE: ${match.utcDate}
STADE: ${match.venue || 'Inconnu'}

CLASSEMENT DOMICILE: ${homeStanding ? `${homeStanding.position}e place, ${homeStanding.won}V ${homeStanding.draw}N ${homeStanding.lost}D, ${homeStanding.goalsFor} buts pour, ${homeStanding.goalsAgainst} contre` : 'Non disponible'}
CLASSEMENT EXTÉRIEUR: ${awayStanding ? `${awayStanding.position}e place, ${awayStanding.won}V ${awayStanding.draw}N ${awayStanding.lost}D, ${awayStanding.goalsFor} buts pour, ${awayStanding.goalsAgainst} contre` : 'Non disponible'}

H2H (5 derniers): ${h2hMatches.length > 0 ? h2hMatches.map(m => {
  const score = m.score?.fullTime ? `${m.score.fullTime.home}-${m.score.fullTime.away}` : '?-?';
  return `${m.homeTeam?.name} ${score} ${m.awayTeam?.name}`;
}).join(' | ') : 'Aucun historique'}

Retourne ce JSON exact (remplace les valeurs par ton analyse):
{
  "result": {"pick": "1 ou N ou 2", "label": "texte court ex: Real Madrid gagne", "confidence": 72, "odds": 1.85},
  "score": {"home": 2, "away": 1, "confidence": 31, "odds": 7.50},
  "btts": {"pick": true, "label": "OUI ou NON", "confidence": 68, "odds": 1.72},
  "value": true,
  "analysis": "Analyse tactique de 2-3 phrases en français",
  "factors": [
    {"label": "Forme domicile", "home": 80, "away": 60, "icon": "🏠"},
    {"label": "Attaque", "home": 85, "away": 70, "icon": "⚡"},
    {"label": "Défense", "home": 75, "away": 65, "icon": "🛡️"},
    {"label": "H2H", "home": 70, "away": 50, "icon": "📊"},
    {"label": "Fraîcheur", "home": 75, "away": 70, "icon": "💪"}
  ]
}`;

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.7, maxOutputTokens: 1024 }
      })
    }
  );
  if (!res.ok) throw new Error(`Gemini: ${res.status}`);
  const data = await res.json();
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
  const clean = text.replace(/```json|```/g, "").trim();
  return JSON.parse(clean);
}

// ── SHARED COMPONENTS ─────────────────────────────────────────────────────────

function ConfidenceRing({ value, size=80, sublabel }) {
  const [animated, setAnimated] = useState(0);
  const stroke = size < 60 ? 5 : 7;
  const r = (size/2) - stroke;
  const circ = 2 * Math.PI * r;
  useEffect(() => { const t = setTimeout(() => setAnimated(value), 120); return () => clearTimeout(t); }, [value]);
  const offset = circ - (animated/100)*circ;
  const hue = confColor(value);
  return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
      <div style={{ position:"relative", width:size, height:size }}>
        <svg width={size} height={size} style={{ transform:"rotate(-90deg)" }}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={stroke} />
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={hue} strokeWidth={stroke}
            strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
            style={{ transition:"stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)", filter:`drop-shadow(0 0 4px ${hue})` }} />
        </svg>
        <div style={{ position:"absolute", inset:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center" }}>
          <span style={{ fontSize: size < 70 ? 13 : 17, fontWeight:800, color:hue, lineHeight:1 }}>{animated}%</span>
          {sublabel && <span style={{ fontSize:9, color:"rgba(255,255,255,0.4)", textTransform:"uppercase", letterSpacing:"0.05em" }}>{sublabel}</span>}
        </div>
      </div>
    </div>
  );
}

function FormBadge({ result }) {
  const cfg = { W:{bg:"#05d46b",text:"#000",label:"V"}, D:{bg:"#f5a623",text:"#000",label:"N"}, L:{bg:"#ff3d5a",text:"#fff",label:"D"} };
  const c = cfg[result] || {bg:"#333",text:"#fff",label:"?"};
  return <div style={{ width:22, height:22, borderRadius:5, background:c.bg, color:c.text, display:"flex", alignItems:"center", justifyContent:"center", fontSize:10, fontWeight:800, flexShrink:0 }}>{c.label}</div>;
}

function FormStrip({ form }) {
  if (!form || form.length === 0) return null;
  return <div style={{ display:"flex", gap:3 }}>{form.slice(0,5).map((r,i) => <FormBadge key={i} result={r} />)}</div>;
}

function TeamLogo({ crest, name, size=48 }) {
  const [err, setErr] = useState(false);
  const initials = (name||"").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  if (err || !crest) return (
    <div style={{ width:size, height:size, borderRadius:size*0.2, background:"rgba(255,255,255,0.08)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:size*0.3, fontWeight:800, color:"rgba(255,255,255,0.6)", flexShrink:0 }}>{initials}</div>
  );
  return <img src={crest} alt={name} width={size} height={size} onError={()=>setErr(true)} style={{ objectFit:"contain", flexShrink:0, filter:"drop-shadow(0 2px 8px rgba(0,0,0,0.5))" }} />;
}

function RadarChart({ factors, homeColor="#05d46b", awayColor="#ff3d5a", size=200 }) {
  const n = factors.length, cx=size/2, cy=size/2, r=size*0.36;
  const step = (2*Math.PI)/n;
  const pt = (angle, val, maxR) => { const d=(val/100)*maxR; return [cx+d*Math.cos(angle-Math.PI/2), cy+d*Math.sin(angle-Math.PI/2)]; };
  const homePts = factors.map((f,i) => pt(i*step, f.home, r));
  const awayPts = factors.map((f,i) => pt(i*step, f.away, r));
  const toPath = pts => pts.map((p,i) => `${i===0?"M":"L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ")+" Z";
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {[.25,.5,.75,1].map(s => { const pts=factors.map((_,i)=>pt(i*step,100*s,r)); return <polygon key={s} points={pts.map(p=>p.join(",")).join(" ")} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="1" />; })}
      {factors.map((_,i) => { const [x,y]=pt(i*step,100,r); return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="rgba(255,255,255,0.06)" strokeWidth="1" />; })}
      <path d={toPath(homePts)} fill={homeColor+"25"} stroke={homeColor} strokeWidth="1.5" />
      <path d={toPath(awayPts)} fill={awayColor+"25"} stroke={awayColor} strokeWidth="1.5" />
      {factors.map((f,i) => { const ang=i*step-Math.PI/2, lx=cx+(r+18)*Math.cos(ang), ly=cy+(r+18)*Math.sin(ang); return <text key={i} x={lx} y={ly} textAnchor="middle" dominantBaseline="central" style={{ fontSize:9, fill:"rgba(255,255,255,0.45)", fontFamily:"Inter,sans-serif" }}>{f.icon}</text>; })}
    </svg>
  );
}

function StatBar({ label, home, away, homeColor, awayColor, unit="" }) {
  const total = home + away;
  const pct = total > 0 ? (home/total)*100 : 50;
  return (
    <div style={{ marginBottom:10 }}>
      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
        <span style={{ fontSize:12, fontWeight:700, color:homeColor }}>{home}{unit}</span>
        <span style={{ fontSize:10, color:"rgba(255,255,255,0.4)", textTransform:"uppercase", letterSpacing:"0.06em" }}>{label}</span>
        <span style={{ fontSize:12, fontWeight:700, color:awayColor }}>{away}{unit}</span>
      </div>
      <div style={{ height:6, background:"rgba(255,255,255,0.06)", borderRadius:3, overflow:"hidden", display:"flex" }}>
        <div style={{ width:`${pct}%`, background:homeColor, borderRadius:"3px 0 0 3px", transition:"width 1s ease" }} />
        <div style={{ flex:1, background:awayColor, borderRadius:"0 3px 3px 0" }} />
      </div>
    </div>
  );
}

// ── CONFIG SCREEN ─────────────────────────────────────────────────────────────
function ConfigScreen({ onSave }) {
  const [fd, setFd] = useState("");
  const [gem, setGem] = useState("");
  const [err, setErr] = useState("");
  const [testing, setTesting] = useState(false);

  const handleSave = async () => {
    if (!fd.trim() || !gem.trim()) { setErr("Les deux clés sont requises."); return; }
    setTesting(true); setErr("");
    try {
      const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent("https://api.football-data.org/v4/matches?dateFrom=2024-01-01&dateTo=2024-01-01")}`;
      const res = await fetch(proxyUrl, { headers: { "X-Auth-Token": fd.trim() } });
      if (res.status === 403 || res.status === 401) throw new Error("Clé Football-Data invalide.");
      store.set("pf_fd_key", fd.trim());
      store.set("pf_gem_key", gem.trim());
      onSave(fd.trim(), gem.trim());
    } catch(e) {
      setErr(e.message || "Erreur de connexion. Vérifiez vos clés.");
    } finally { setTesting(false); }
  };

  return (
    <div className="config-overlay">
      <div className="config-box">
        <div style={{ textAlign:"center", marginBottom:28 }}>
          <div style={{ fontSize:36, fontWeight:900, color:"#e2e8f4", fontFamily:"'Bebas Neue',sans-serif", letterSpacing:3 }}>PREDI<span style={{ color:"#05d46b" }}>CTOR</span></div>
          <div style={{ fontSize:11, color:"rgba(255,255,255,0.35)", letterSpacing:"0.12em", textTransform:"uppercase", marginTop:4 }}>Configuration initiale</div>
        </div>

        <div style={{ marginBottom:20 }}>
          <div style={{ fontSize:10, color:"rgba(255,255,255,0.4)", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:8, fontWeight:700 }}>
            🔑 Clé Football-Data.org
          </div>
          <input className="config-input" type="password" placeholder="Votre token Football-Data.org" value={fd} onChange={e=>setFd(e.target.value)} />
          <div style={{ fontSize:10, color:"rgba(255,255,255,0.25)", marginTop:-6, marginBottom:4 }}>
            Obtenir gratuitement sur football-data.org
          </div>
        </div>

        <div style={{ marginBottom:24 }}>
          <div style={{ fontSize:10, color:"rgba(255,255,255,0.4)", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:8, fontWeight:700 }}>
            🤖 Clé Google Gemini
          </div>
          <input className="config-input" type="password" placeholder="Votre clé API Gemini" value={gem} onChange={e=>setGem(e.target.value)} />
          <div style={{ fontSize:10, color:"rgba(255,255,255,0.25)", marginTop:-6, marginBottom:4 }}>
            Obtenir gratuitement sur aistudio.google.com
          </div>
        </div>

        {err && <div style={{ background:"rgba(255,61,90,0.1)", border:"1px solid #ff3d5a44", borderRadius:8, padding:"10px 14px", fontSize:12, color:"#ff3d5a", marginBottom:16 }}>{err}</div>}

        <button className="config-btn" onClick={handleSave} disabled={testing}>
          {testing ? "⟳ Vérification..." : "LANCER L'APPLICATION →"}
        </button>

        <div style={{ marginTop:16, fontSize:10, color:"rgba(255,255,255,0.2)", textAlign:"center", lineHeight:1.6 }}>
          Vos clés sont stockées uniquement sur votre appareil.<br/>Elles ne transitent jamais par un serveur tiers.
        </div>
      </div>
    </div>
  );
}

// ── MATCH ANALYSIS PANEL ──────────────────────────────────────────────────────
function AnalysisPanel({ match, prono, homeColor, awayColor }) {
  if (!prono) return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:12, padding:"40px 0" }}>
      <div className="loader-ring" />
      <span style={{ fontSize:12, color:"rgba(255,255,255,0.35)" }}>Gemini analyse le match...</span>
    </div>
  );

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
      <div style={{ background:"#0c1220", borderRadius:12, padding:16, border:"1px solid rgba(255,255,255,0.07)" }}>
        <div style={{ fontSize:10, color:"#05d46b", textTransform:"uppercase", letterSpacing:"0.1em", fontWeight:700, marginBottom:10 }}>🤖 Analyse Gemini IA</div>
        <p style={{ fontSize:13, color:"rgba(255,255,255,0.65)", lineHeight:1.75, margin:0 }}>{prono.analysis}</p>
      </div>

      {prono.factors && (
        <div style={{ background:"#0c1220", borderRadius:12, padding:16, border:"1px solid rgba(255,255,255,0.07)" }}>
          <div style={{ fontSize:10, color:"rgba(255,255,255,0.4)", textTransform:"uppercase", letterSpacing:"0.1em", fontWeight:700, marginBottom:14 }}>Facteurs clés</div>
          {prono.factors.map((f,i) => (
            <div key={i} style={{ marginBottom:12 }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                <span style={{ fontSize:11, color:"rgba(255,255,255,0.55)", display:"flex", gap:6 }}><span>{f.icon}</span>{f.label}</span>
                <span style={{ fontSize:10, color:"rgba(255,255,255,0.28)" }}>{f.home} vs {f.away}</span>
              </div>
              <div style={{ height:5, background:"rgba(255,255,255,0.06)", borderRadius:3, display:"flex", overflow:"hidden" }}>
                <div style={{ width:`${f.home}%`, background:`linear-gradient(90deg,${homeColor}88,${homeColor})`, borderRadius:3, transition:"width 1s ease" }} />
              </div>
            </div>
          ))}
        </div>
      )}

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10 }}>
        {[
          { label:"Résultat", ring: prono.result.confidence, display: prono.result.pick, odds: prono.result.odds, col: confColor(prono.result.confidence), big:true },
          { label:"Score exact", ring: prono.score.confidence, display:`${prono.score.home}-${prono.score.away}`, odds: prono.score.odds, col:"#e2e8f4" },
          { label:"Les 2 marquent", ring: prono.btts.confidence, display: prono.btts.label, odds: prono.btts.odds, col: prono.btts.pick?"#05d46b":"#ff3d5a" },
        ].map(c => (
          <div key={c.label} style={{ background:"#0c1220", borderRadius:12, padding:14, border:`1px solid ${c.col}22`, textAlign:"center" }}>
            <div style={{ fontSize:8, color:"rgba(255,255,255,0.3)", textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:8 }}>{c.label}</div>
            <ConfidenceRing value={c.ring} size={68} />
            <div style={{ marginTop:8, fontSize: c.big?24:20, fontWeight:900, color:c.col, fontFamily:"'Bebas Neue',sans-serif", lineHeight:1 }}>{c.display}</div>
            <div style={{ fontSize:9, color:"rgba(255,255,255,0.35)", marginTop:4 }}>Cote {c.odds}</div>
          </div>
        ))}
      </div>

      {prono.factors && (
        <div style={{ background:"#0c1220", borderRadius:12, padding:16, border:"1px solid rgba(255,255,255,0.07)" }}>
          <div style={{ fontSize:10, color:"rgba(255,255,255,0.4)", textTransform:"uppercase", letterSpacing:"0.1em", fontWeight:700, marginBottom:10 }}>Radar de forme</div>
          <div style={{ display:"flex", alignItems:"center", gap:16 }}>
            <RadarChart factors={prono.factors} homeColor={homeColor} awayColor={awayColor} size={176} />
            <div style={{ flex:1, display:"flex", flexDirection:"column", gap:8 }}>
              {[{color:homeColor,name:match.homeTeam.name},{color:awayColor,name:match.awayTeam.name}].map(t => (

                  <div style={{ width:8, height:8, borderRadius:2, background:t.color }} />
                  <span style={{ fontSize:11, color:"rgba(255,255,255,0.55)" }}>{t.name}</span>
                </div>
              ))}
              {prono.factors.map(f => <div key={f.label} style={{ fontSize:9, color:"rgba(255,255,255,0.28)", display:"flex", gap:4 }}><span>{f.icon}</span><span>{f.label}</span></div>)}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── H2H PANEL ─────────────────────────────────────────────────────────────────
function H2HPanel({ h2h, homeTeam, awayTeam, homeColor, awayColor }) {
  if (!h2h || h2h.length === 0) return (
    <div style={{ textAlign:"center", color:"rgba(255,255,255,0.25)", fontSize:13, padding:"40px 0" }}>Aucun historique disponible</div>
  );

  const wins = { home:0, draw:0, away:0 };
  h2h.forEach(m => {
    const ft = m.score?.fullTime;
    if (!ft || ft.home === null) return;
    if (ft.home > ft.away) wins.home++;
    else if (ft.home === ft.away) wins.draw++;
    else wins.away++;
  });

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10, marginBottom:4 }}>
        {[{label:homeTeam.shortName||homeTeam.name,value:wins.home,color:homeColor},{label:"NUL",value:wins.draw,color:"#f5a623"},{label:awayTeam.shortName||awayTeam.name,value:wins.away,color:awayColor}].map(s => (
          <div key={s.label} style={{ background:"#0c1220", borderRadius:12, padding:"12px 8px", textAlign:"center", border:`1px solid ${s.color}33` }}>
            <div style={{ fontSize:26, fontWeight:900, color:s.color, fontFamily:"'Bebas Neue',sans-serif" }}>{s.value}</div>
            <div style={{ fontSize:9, color:"rgba(255,255,255,0.4)", textTransform:"uppercase", letterSpacing:"0.08em" }}>{s.label}</div>
          </div>
        ))}
      </div>
      {h2h.map((m,i) => {
        const ft = m.score?.fullTime;
        const scoreStr = ft && ft.home !== null ? `${ft.home}-${ft.away}` : "?-?";
        let wc = "#f5a623";
        if (ft && ft.home !== null) {
          if (ft.home > ft.away) wc = homeColor;
          else if (ft.away > ft.home) wc = awayColor;
        }
        const d = new Date(m.utcDate).toLocaleDateString("fr-FR", { month:"short", year:"numeric" });
        return (
          <div key={i} style={{ background:"#0c1220", borderRadius:10, padding:"10px 14px", border:"1px solid rgba(255,255,255,0.06)", display:"flex", alignItems:"center", gap:10 }}>
            <span style={{ fontSize:9, color:"rgba(255,255,255,0.28)", minWidth:58 }}>{d}</span>
            <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <span style={{ fontSize:11, fontWeight:600, color:"rgba(255,255,255,0.65)" }}>{m.homeTeam?.shortName||m.homeTeam?.name}</span>
              <span style={{ fontSize:15, fontWeight:900, color:wc, fontFamily:"'Bebas Neue',sans-serif", padding:"0 10px" }}>{scoreStr}</span>
              <span style={{ fontSize:11, fontWeight:600, color:"rgba(255,255,255,0.65)" }}>{m.awayTeam?.shortName||m.awayTeam?.name}</span>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── MATCH CARD ────────────────────────────────────────────────────────────────
function MatchCard({ match, prono, onClick }) {
  const [hov, setHov] = useState(false);
  const league = leagueFromId(match.competition?.id);
  const time = new Date(match.utcDate).toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
  const isTop = prono?.value;
  const col = prono ? confColor(prono.result.confidence) : "#888";
  const status = match.status;
  const isLive = status === "IN_PLAY" || status === "PAUSED";
  const isFinished = status === "FINISHED";

  const scoreDisplay = () => {
    if (isFinished || isLive) {
      const ft = match.score?.fullTime || match.score?.halfTime;
      if (ft && ft.home !== null) return `${ft.home} - ${ft.away}`;
    }
    return null;
  };
  const scoreStr = scoreDisplay();

  return (
    <div onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)} onClick={onClick}
      style={{ background: hov?"#131e30":"#0d1624", border: isTop?`1px solid ${col}55`:"1px solid rgba(255,255,255,0.07)", borderRadius:14, padding:"16px 18px", cursor:"pointer", transition:"all 0.2s", boxShadow: isTop?`0 0 24px ${col}18`:hov?"0 8px 32px rgba(0,0,0,0.5)":"none", position:"relative", overflow:"hidden" }}>
      <div style={{ position:"absolute", top:0, left:0, right:0, height:2, background:`linear-gradient(90deg,#05d46b,transparent 40%,transparent 60%,#f5a623)`, opacity:0.7 }} />
      {isTop && prono && <div style={{ position:"absolute", top:10, right:12, background:"#05d46b", color:"#000", fontSize:8, fontWeight:800, padding:"2px 7px", borderRadius:20, textTransform:"uppercase", letterSpacing:"0.1em" }}>⚡ Top pick</div>}

      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        <span style={{ fontSize:9, fontWeight:700, color:league.color, background:league.color+"18", padding:"2px 8px", borderRadius:20, textTransform:"uppercase", letterSpacing:"0.1em" }}>{league.short}</span>
        <div style={{ display:"flex", alignItems:"center", gap:6 }}>
          {isLive && <span style={{ fontSize:8, fontWeight:700, color:"#ff3d5a", background:"rgba(255,61,90,0.12)", padding:"2px 7px", borderRadius:20, letterSpacing:"0.08em" }} className="pulse">🔴 LIVE</span>}
          {isFinished && <span style={{ fontSize:8, fontWeight:700, color:"rgba(255,255,255,0.4)", background:"rgba(255,255,255,0.06)", padding:"2px 7px", borderRadius:20 }}>TERMINÉ</span>}
          {!isLive && !isFinished && <span style={{ fontSize:8, fontWeight:700, color:"#05d46b", background:"rgba(5,212,107,0.12)", padding:"2px 7px", borderRadius:20, letterSpacing:"0.08em" }}>⏱ À VENIR</span>}
          <span style={{ fontSize:10, color:"rgba(255,255,255,0.35)" }}>{time}</span>
        </div>
      </div>

      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, marginBottom:14 }}>
        <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:5 }}>
          <TeamLogo crest={match.homeTeam.crest} name={match.homeTeam.name} size={40} />
          <span style={{ fontSize:10, fontWeight:700, color:"#e2e8f4", textAlign:"center", lineHeight:1.2 }}>{match.homeTeam.shortName || match.homeTeam.name}</span>
        </div>
        {scoreStr
          ? <span style={{ fontSize:22, fontWeight:900, color:"#e2e8f4", fontFamily:"'Bebas Neue',sans-serif", letterSpacing:2 }}>{scoreStr}</span>
          : <span style={{ fontSize:16, fontWeight:900, color:"rgba(255,255,255,0.18)", fontFamily:"'Bebas Neue',sans-serif" }}>VS</span>
        }
        <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:5 }}>
          <TeamLogo crest={match.awayTeam.crest} name={match.awayTeam.name} size={40} />
          <span style={{ fontSize:10, fontWeight:700, color:"#e2e8f4", textAlign:"center", lineHeight:1.2 }}>{match.awayTeam.shortName || match.awayTeam.name}</span>
        </div>

      {prono ? (
        <div style={{ background:"rgba(0,0,0,0.3)", borderRadius:10, padding:"10px 12px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div>
            <div style={{ fontSize:8, color:"rgba(255,255,255,0.3)", textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:3 }}>Pronostic Gemini</div>
            <div style={{ fontSize:12, fontWeight:800, color:"#e2e8f4" }}>{prono.result.label}</div>

}

// ── PODIUM ────────────────────────────────────────────────────────────────────
function Podium({ matches, pronos, title, onSelect }) {
  const withPronos = matches.filter(m => pronos[m.id]);
  const top3 = [...withPronos].sort((a,b) => (pronos[b.id]?.result.confidence||0) - (pronos[a.id]?.result.confidence||0)).slice(0,3);
  if (top3.length < 2) return null;
  const order = top3.length >= 3
    ? [{ m: top3[1], rank:2 }, { m: top3[0], rank:1 }, { m: top3[2], rank:3 }]
    : top3.map((m,i) => ({ m, rank:i+1 }));
  const cfg = {
    1:{ medal:"🥇", podH:72, gradient:"linear-gradient(180deg,#ffd700,#b8860b)", textColor:"#000", glow:"rgba(255,215,0,0.3)", cardBorder:"#ffd70066" },
    2:{ medal:"🥈", podH:50, gradient:"linear-gradient(180deg,#d0d0d0,#808080)", textColor:"#000", glow:"rgba(192,192,192,0.2)", cardBorder:"#c0c0c055" },
    3:{ medal:"🥉", podH:36, gradient:"linear-gradient(180deg,#cd7f32,#7a4a1e)", textColor:"#fff", glow:"rgba(205,127,50,0.15)", cardBorder:"#cd7f3244" },
  };
  return (
    <div style={{ marginBottom:28 }}>
      <div style={{ display:"flex", alignItems:"baseline", gap:8, marginBottom:14 }}>
        <h2 style={{ fontSize:14, fontWeight:800, color:"#e2e8f4", textTransform:"uppercase", letterSpacing:"0.12em" }}>{title}</h2>
        <span style={{ fontSize:10, color:"rgba(255,255,255,0.35)" }}>{top3.length} matchs analysés</span>
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, alignItems:"end" }}>
        {order.map(({ m, rank }) => {
          const c = cfg[rank];
          const prono = pronos[m.id];
          const col = confColor(prono.result.confidence);
          const league = leagueFromId(m.competition?.id);
          const time = new Date(m.utcDate).toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
          return (
            <div key={m.id} onClick={() => onSelect(m)} style={{ cursor:"pointer", display:"flex", flexDirection:"column" }}>
              <div style={{ background:"#0d1624", borderRadius:12, padding:"12px 8px", border:`1px solid ${c.cardBorder}`, textAlign:"center", marginBottom:4, boxShadow:`0 0 20px ${c.glow}`, transition:"transform 0.2s" }}
                onMouseEnter={e=>e.currentTarget.style.transform="translateY(-3px)"}
                onMouseLeave={e=>e.currentTarget.style.transform="translateY(0)"}>
                <div style={{ fontSize:18, marginBottom:6 }}>{c.medal}</div>
                <div style={{ display:"flex", justifyContent:"center", alignItems:"center", gap:6, marginBottom:8 }}>
                  <TeamLogo crest={m.homeTeam.crest} name={m.homeTeam.name} size={26} />
                  <span style={{ fontSize:8, color:"rgba(255,255,255,0.3)", fontWeight:700 }}>vs</span>
                  <TeamLogo crest={m.awayTeam.crest} name={m.awayTeam.name} size={26} />
                </div>
                <div style={{ fontSize:9, fontWeight:700, color:"rgba(255,255,255,0.55)", lineHeight:1.4, marginBottom:6 }}>
                  {m.homeTeam.shortName||m.homeTeam.name} — {m.awayTeam.shortName||m.awayTeam.name}
                </div>
                <div style={{ display:"flex", justifyContent:"center", marginBottom:6 }}>
                  <ConfidenceRing value={prono.result.confidence} size={48} sublabel="conf." />
                </div>
                <div style={{ fontSize:11, fontWeight:800, color:col, fontFamily:"'Bebas Neue',sans-serif", letterSpacing:1 }}>{prono.result.label}</div>
                <div style={{ fontSize:9, color:"rgba(255,255,255,0.3)", marginTop:3 }}>{league.short} · {time}</div>
              </div>
              <div style={{ height:c.podH, background:c.gradient, borderRadius:"8px 8px 3px 3px", display:"flex", alignItems:"center", justifyContent:"center" }}>
                <span style={{ fontSize:22, fontWeight:900, color:c.textColor, fontFamily:"'Bebas Neue',sans-serif" }}>{rank}</span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────

          <div style={{ textAlign:"center", color:"rgba(255,255,255,0.25)", fontSize:13, padding:"40px 0" }}>

          </div>
        )}
      </div>
    </div>
  );
}

  const [matches, setMatches] = useState([]);
  const [pronos, setPronos] = useState({});
  const [h2hData, setH2hData] = useState({});
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [lastUpdate, setLastUpdate] = useState("");
  const [selected, setSelected] = useState(null);
  const refreshTimer = useRef(null);

  const loadData = useCallback(async (fd, gem) => {
    if (!fd || !gem) return;
    setLoading(true);
    setError("");
    try {
      // 1. Fetch matches
      const rawMatches = await fetchMatches(fd);
      setMatches(rawMatches);
      setLastUpdate(new Date().toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" }));

      // 2. Analyze each match with Gemini + fetch H2H (sequentially to avoid rate limits)
      for (const match of rawMatches) {
        // Skip if already analyzed recently
        const cacheKey = `prono_${match.id}_${new Date().toISOString().slice(0,10)}`;
        const cached = store.get(cacheKey);
        if (cached) {
          try {
            setPronos(prev => ({ ...prev, [match.id]: JSON.parse(cached) }));
            continue;
          } catch {}
        }

        try {
          // Fetch H2H
          const h2h = await fetchH2H(fd, match.id);
          setH2hData(prev => ({ ...prev, [match.id]: h2h }));

          // Try to get standings for context
          let homeStanding = null, awayStanding = null;
          try {
            const standings = await fetchStandings(fd, match.competition.id);
            const table = standings?.standings?.[0]?.table || [];
            homeStanding = table.find(t => t.team?.id === match.homeTeam?.id);
            awayStanding = table.find(t => t.team?.id === match.awayTeam?.id);
          } catch {}

          // Analyze with Gemini
          const prono = await analyzeMatchWithGemini(gem, match, h2h, homeStanding, awayStanding);
          store.set(cacheKey, JSON.stringify(prono));
          setPronos(prev => ({ ...prev, [match.id]: prono }));

          // Small delay to avoid hitting Gemini rate limits
          await new Promise(r => setTimeout(r, 800));
        } catch (e) {
          console.warn(`Failed to analyze match ${match.id}:`, e);
        }
      }
    } catch (e) {
      setError(e.message || "Erreur lors du chargement des données.");
    } finally {
      setLoading(false);
    }
  }, []);

  // Initial load + auto-refresh
  useEffect(() => {
    if (!showConfig && fdKey && gemKey) {
      loadData(fdKey, gemKey);
      refreshTimer.current = setInterval(() => loadData(fdKey, gemKey), REFRESH_INTERVAL);
    }
    return () => clearInterval(refreshTimer.current);
  }, [showConfig, fdKey, gemKey, loadData]);

  const handleConfigSave = (fd, gem) => {
    setFdKey(fd);
    setGemKey(gem);
    setShowConfig(false);
  };

  const handleSettings = () => {
    if (confirm("Réinitialiser la configuration ?")) {
      store.set("pf_fd_key", "");
      store.set("pf_gem_key", "");
      setShowConfig(true);
      setMatches([]);
      setPronos({});
    }
  };

  if (showConfig) return <ConfigScreen onSave={handleConfigSave} />;

  if (selected) {
    return (
      <MatchDetail
        match={selected}
        prono={pronos[selected.id]}
        h2h={h2hData[selected.id]}
        onBack={() => setSelected(null)}
        fdKey={fdKey}
        gemKey={gemKey}
      />
    );
  }

  return (
    <Dashboard
      matches={matches}
      pronos={pronos}
      loading={loading}
      error={error}
      lastUpdate={lastUpdate}
      onSelect={setSelected}
      onRefresh={() => loadData(fdKey, gemKey)}
      onSettings={handleSettings}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
